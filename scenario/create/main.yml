name: create
create: true
description: >-
  Create the machines for Redis and deploy it on them. The scenario raises the hosts
  itself — there is nothing to pick.

extends: scenario-create

input:
  machine_count:
    type: integer
    required: false
    default: 1
    min: 1
    max: 3
    description: >-
      How many machines to create. Each one gets its own standalone Redis with the same
      config and users — there is no replication here. Replication, sentinel and cluster
      are the engine's `examples/service/redis`; this service is about the create path.

compute:
  # What the roster is supposed to look like once this run has built it. deploy.yml holds
  # the outcome against it, and `state.yml` records it — so a machine that never came up
  # is a red run rather than an incarnation claiming hosts it does not have.
  expected_hosts: "${ int(input.machine_count) }"

form:
  sections:
    - key: ownership
      title: "Ownership"
      fields:
        - { name: owners, label: "Owners", placeholder: "team-cache" }
        - { name: environment, label: "Environment" }
    - key: redis
      title: "Redis"
      fields:
        - { name: version, label: "Version" }
        - { name: machine_count, label: "Machines", placeholder: "1" }
    - key: resources
      title: "Resources"
      fields:
        - { name: memory_mb, label: "Memory for Redis, MB", placeholder: "512" }
        - { name: maxmemory_policy, label: "Eviction policy" }
    - key: durability
      title: "Durability"
      fields:
        - { name: persistence, label: "Persistence" }
    - key: users
      title: "Users"
      fields:
        - { name: users, label: "ACL users" }
    - key: config
      title: "Configuration"
      collapsed: true
      fields:
        - { name: redis_settings, label: "redis.conf directives" }

tasks:
  - include: provision.yml
  - include: deploy.yml
